services:
    db:
        image: postgres:15-alpine
        environment:
            POSTGRES_DB: agrotech_db
            POSTGRES_USER: agrotech_user
            POSTGRES_PASSWORD: agrotech_password
        volumes:
            - postgres_data:/var/lib/postgresql/data
        ports:
            - '5432:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U agrotech_user -d agrotech_db']
            interval: 5s
            timeout: 5s
            retries: 5

    redis:
        image: redis:7-alpine
        ports:
            - '6379:6379'
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 5

    web:
        build: .
        # daphne -b 0.0.0.0 -p 8000 agrotech_project.asgi:application
        command: python manage.py runserver 0.0.0.0:8001
        volumes:
            - .:/app
        ports:
            - '8001:8001'
        environment:
            - DATABASE_URL=postgres://agrotech_user:agrotech_password@db:5432/agrotech_db
            - CELERY_BROKER_URL=redis://redis:6379/0
            - GROQ_API_KEY=${GROQ_API_KEY}
            - GEMINI_API_KEY=${GEMINI_API_KEY}
            - SECRET_KEY=${SECRET_KEY}
        env_file:
            - .env
        depends_on:
            db:
                condition: service_healthy
            redis:
                condition: service_healthy

    celery:
        build: .
        command: celery -A agrotech_project worker -l INFO
        volumes:
            - .:/app
        environment:
            - DATABASE_URL=postgres://agrotech_user:agrotech_password@db:5432/agrotech_db
            - CELERY_BROKER_URL=redis://redis:6379/0
            - GROQ_API_KEY=${GROQ_API_KEY}
            - GEMINI_API_KEY=${GEMINI_API_KEY}
        env_file:
            - .env
        depends_on:
            redis:
                condition: service_healthy
            db:
                condition: service_healthy

    mongodb:
        image: mongo:7.0
        ports:
            - '27017:27017'
        volumes:
            - mongodb_data:/data/db
        healthcheck:
            test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
            interval: 10s
            timeout: 5s
            retries: 5

volumes:
    postgres_data:
    mongodb_data:
