{% load static %}
<!doctype html>
<html lang="es-cl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Agrotech - Gestión de Cultivos</title>
        <link rel="stylesheet" href="{% static 'css/output.css' %}" />
    </head>
    <body
        class="bg-[#f8fafc] text-slate-800 font-sans antialiased selection:bg-emerald-200 selection:text-emerald-900 min-h-screen relative overflow-x-hidden"
    >
        <div
            class="absolute top-0 left-0 w-full h-96 bg-linear-to-b from-emerald-50/80 to-transparent -z-10"
        ></div>
        <div
            class="absolute top-[-10%] right-[-5%] w-125 h-125 rounded-full bg-emerald-300/20 blur-[80px] -z-10"
        ></div>

        <nav
            class="fixed top-6 inset-x-4 md:inset-x-8 lg:inset-x-auto lg:w-full lg:max-w-5xl lg:left-1/2 lg:-translate-x-1/2 z-50 bg-white/70 backdrop-blur-xl border border-white/80 shadow-[0_8px_30px_rgb(0,0,0,0.04)] rounded-full px-6 py-3 flex justify-between items-center transition-all"
        >
            <div class="flex items-center gap-3">
                <div
                    class="w-10 h-10 rounded-full bg-linear-to-br from-emerald-400 to-teal-600 flex items-center justify-center shadow-inner"
                >
                    <svg
                        class="w-5 h-5 text-white"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2.5"
                            d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"
                        ></path>
                    </svg>
                </div>
                <span class="text-slate-900 text-lg font-extrabold tracking-tight"
                    >Agrotech<span class="text-emerald-600 font-medium">Hub</span></span
                >
            </div>
            <div class="flex gap-1 bg-slate-100/50 p-1 rounded-full border border-slate-200/60">
                <a
                    href="{% url 'farmfield_list' %}"
                    class="px-5 py-2 rounded-full text-sm font-semibold text-slate-600 hover:text-slate-900 hover:bg-white hover:shadow-sm transition-all"
                    >Campos</a
                >
                <a
                    href="{% url 'crop_list' %}"
                    class="px-5 py-2 rounded-full text-sm font-semibold text-slate-600 hover:text-slate-900 hover:bg-white hover:shadow-sm transition-all"
                    >Cultivos</a
                >
            </div>
        </nav>

        <main
            class="pt-32 pb-16 px-4 md:px-8 lg:px-24 max-w-7xl mx-auto min-h-[85vh] flex flex-col"
        >
            {% block content %}{% endblock %}
        </main>

        <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-4"></div>

        <script>
            const connectWebSocket = () => {
                const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
                const ws = new WebSocket(`${protocol}${window.location.host}/ws/notifications/`);
                let pingInterval;

                ws.onopen = () => {
                    pingInterval = setInterval(() => {
                        if (ws.readyState === WebSocket.OPEN) {
                            ws.send(JSON.stringify({ type: 'ping' }));
                        }
                    }, 20000);
                };

                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    if (data.type === 'pong') return;

                    const aiData = data.message;
                    if (!aiData) return;

                    const toast = document.createElement('div');
                    toast.className =
                        'bg-slate-900 border border-emerald-500/30 shadow-[0_10px_30px_rgb(0,0,0,0.2)] rounded-2xl p-5 w-80 transform transition-all duration-300 translate-y-10 opacity-0 relative';

                    toast.innerHTML = `
                        <button class="absolute top-4 right-4 text-slate-500 hover:text-white transition-colors cursor-pointer" onclick="(e => e.target.closest('div.relative').remove())(event)">
                            <svg class="w-4 h-4 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                        <div class="flex items-center gap-3 mb-2 pr-6">
                            <div class="w-8 h-8 rounded-full bg-emerald-500/20 flex items-center justify-center text-emerald-400">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                            </div>
                            <h4 class="text-white font-bold text-sm tracking-wide">Reporte IA: ${aiData.crop_name}</h4>
                        </div>
                        <p class="text-slate-300 text-xs leading-relaxed mb-3">${aiData.ai_recommendation}</p>
                        <div class="flex justify-between items-center bg-slate-800/50 rounded-lg p-2">
                            <span class="text-[10px] font-bold text-slate-400 uppercase">Riesgo</span>
                            <span class="text-xs font-bold ${aiData.risk_level === 'Alto' ? 'text-rose-400' : 'text-emerald-400'}">${aiData.risk_level}</span>
                        </div>
                    `;

                    document.getElementById('toast-container').appendChild(toast);

                    setTimeout(() => {
                        toast.classList.remove('translate-y-10', 'opacity-0');
                    }, 50);
                };

                ws.onclose = () => {
                    clearInterval(pingInterval);
                    console.warn('WebSocket desconectado...');
                    setTimeout(connectWebSocket, 3000);
                };
            };

            connectWebSocket();
        </script>
    </body>
</html>
